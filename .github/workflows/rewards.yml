name: Run MS Rewards Farmer

on:
  schedule:
    - cron: '0 7 * * *' # Chạy tự động mỗi ngày lúc 7 giờ sáng UTC
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên web

jobs:
  run-rewards:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: |
        poetry install --no-root

    - name: Install Playwright browsers
      run: |
        poetry run playwright install --with-deps chromium

    - name: Run script with Secrets
      env:
        MS_USER: ${{ secrets.MS_USER }}
        MS_PASS: ${{ secrets.MS_PASS }}
      run: |
        poetry run python src/main.py
        
