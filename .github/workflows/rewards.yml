name: Run MS Rewards Farmer

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-rewards:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1

    # Khôi phục cache phiên đăng nhập của Edge từ lần chạy trước (nếu có)
    - name: Restore Browser Profile Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-rewards-profile
        key: ${{ runner.os }}-edge-profile-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-edge-profile-

    - name: Install dependencies
      run: |
        poetry install --no-root

    - name: Setup Edge and WebDriver
      uses: browser-actions/setup-edge@latest

    - name: Run script
      env:
        MS_USER: ${{ secrets.MS_USER }}
        MS_PASS: ${{ secrets.MS_PASS }}
      run: |
        poetry run python src/main.py
